services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: yumesute
      POSTGRES_USER: yumesute
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run prepare first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yumesute -d yumesute"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  database:
