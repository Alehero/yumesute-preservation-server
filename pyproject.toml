[project]
name = "yumesute-preservation-server"
version = "0.1.0"
description = "Local Yumesute preservation server based on Server of Dreams"
requires-python = ">=3.12,<3.13"
dependencies = [
 "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "msgpack==1.1.2",
 "PyYAML>=6", "asyncpg>=0.30", "peewee>=3.17", "psycopg2-binary>=2.9",
 "PyJWT>=2.8", "brotli>=1.1", "spookyhash>=2.1", "requests>=2.32",
 "lz4==4.4.5", "mitmproxy==12.2.3", "qrcode==8.2", "Pillow>=11", "httpx>=0.28", "cryptography>=44"
]
[tool.uv]
package = false
